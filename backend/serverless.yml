      - http:
          path: cart
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # Order APIs
  createOrder:
    handler: src/handlers/orders.createOrder
    events:
      - http:
          path: orders
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  getOrders:
