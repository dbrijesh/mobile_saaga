service: saaga-online-api

frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-southeast-1  # Singapore region
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30

  environment:
    PRODUCTS_TABLE: ${self:service}-products-${self:provider.stage}
    USERS_TABLE: ${self:service}-users-${self:provider.stage}
    ORDERS_TABLE: ${self:service}-orders-${self:provider.stage}
    CART_TABLE: ${self:service}-cart-${self:provider.stage}
    ADDRESSES_TABLE: ${self:service}-addresses-${self:provider.stage}
    CATEGORIES_TABLE: ${self:service}-categories-${self:provider.stage}
    SUBCATEGORIES_TABLE: ${self:service}-subcategories-${self:provider.stage}
    SHIPPING_DATES_TABLE: ${self:service}-shipping-dates-${self:provider.stage}
    COUPONS_TABLE: ${self:service}-coupons-${self:provider.stage}
    USER_POOL_ID: ${self:custom.userPoolId}
    USER_POOL_CLIENT_ID: ${self:custom.userPoolClientId}
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
    PRODUCT_IMAGES_BUCKET: ${self:service}-product-images-${self:provider.stage}
    REGION: ${self:provider.region}

  vpc:
    securityGroupIds:
      - !Ref LambdaSecurityGroup
    subnetIds:
      - !Ref PrivateSubnetA
      - !Ref PrivateSubnetB

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PRODUCTS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.USERS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ORDERS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.CART_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ADDRESSES_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.CATEGORIES_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUBCATEGORIES_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SHIPPING_DATES_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COUPONS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PRODUCTS_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ORDERS_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ADDRESSES_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUBCATEGORIES_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SHIPPING_DATES_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COUPONS_TABLE}/index/*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${self:provider.environment.PRODUCT_IMAGES_BUCKET}/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
          Resource: "arn:aws:cognito-idp:${self:provider.region}:*:userpool/*"
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
          Resource: "*"

custom:
  userPoolId: !Ref CognitoUserPool
  userPoolClientId: !Ref CognitoUserPoolClient

functions:
  # Product APIs
  getProducts:
    handler: src/handlers/products.getProducts
    events:
      - http:
          path: products
          method: get
          cors: true
          private: true

  getProductById:
    handler: src/handlers/products.getProductById
    events:
      - http:
          path: products/{id}
          method: get
          cors: true
          private: true

  searchProducts:
    handler: src/handlers/products.searchProducts
    events:
      - http:
          path: products/search
          method: get
          cors: true
          private: true

  getProductsByCategory:
    handler: src/handlers/products.getProductsByCategory
    events:
      - http:
          path: products/category/{category}
          method: get
          cors: true
          private: true

  # Category APIs
  getCategories:
    handler: src/handlers/categories.getCategories
    events:
      - http:
          path: categories
          method: get
          cors: true
          private: true

  # SubCategory APIs
  getSubCategories:
    handler: src/handlers/subcategories.getSubCategories
    events:
      - http:
          path: subcategories
          method: get
          cors: true
          private: true

  # Shipping Dates APIs
  getAvailableShippingDates:
    handler: src/handlers/shipping-dates.getAvailableDates
    events:
      - http:
          path: shipping-dates/available
          method: get
          cors: true
          private: true

  # Cart APIs
  getCart:
    handler: src/handlers/cart.getCart
    events:
      - http:
          path: cart
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  addToCart:
    handler: src/handlers/cart.addToCart
    events:
      - http:
          path: cart
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  updateCartItem:
    handler: src/handlers/cart.updateCartItem
    events:
      - http:
          path: cart/{itemId}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  removeFromCart:
    handler: src/handlers/cart.removeFromCart
    events:
      - http:
          path: cart/{itemId}
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
